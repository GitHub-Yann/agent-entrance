<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Agent 流式代理测试</title>
	<style>
		:root {
			color-scheme: light;
			font-family: Arial, "Microsoft YaHei", sans-serif;
			background: #f5f7fb;
			color: #1f2937;
		}

		body {
			margin: 0;
			min-height: 100vh;
		}

		.shell {
			display: grid;
			grid-template-columns: 320px minmax(0, 1fr);
			min-height: 100vh;
		}

		.panel {
			background: #ffffff;
			border-right: 1px solid #d8dee9;
			padding: 20px;
		}

		.panel h1 {
			font-size: 20px;
			margin: 0 0 20px;
		}

		label {
			display: block;
			font-size: 13px;
			font-weight: 700;
			margin: 14px 0 6px;
		}

		input,
		select,
		textarea,
		button {
			box-sizing: border-box;
			font: inherit;
			width: 100%;
		}

		input,
		select,
		textarea {
			border: 1px solid #c9d1df;
			border-radius: 6px;
			padding: 10px;
			background: #ffffff;
		}

		textarea {
			min-height: 120px;
			resize: vertical;
		}

		button {
			border: 0;
			border-radius: 6px;
			padding: 11px 14px;
			background: #2563eb;
			color: #ffffff;
			font-weight: 700;
			cursor: pointer;
			margin-top: 16px;
		}

		button:disabled {
			background: #94a3b8;
			cursor: not-allowed;
		}

		.chat {
			display: flex;
			flex-direction: column;
			min-width: 0;
		}

		.toolbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			padding: 16px 20px;
			background: #ffffff;
			border-bottom: 1px solid #d8dee9;
		}

		.status {
			font-size: 13px;
			color: #64748b;
		}

		.messages {
			flex: 1;
			overflow: auto;
			padding: 20px;
		}

		.message {
			max-width: 820px;
			margin: 0 0 14px;
			padding: 12px 14px;
			border-radius: 8px;
			line-height: 1.55;
			border: 1px solid transparent;
		}

		.message-body {
			display: flex;
			flex-direction: column;
			gap: 12px;
		}

		.user {
			margin-left: auto;
			background: #dbeafe;
			border-color: #bfdbfe;
		}

		.assistant {
			background: #ffffff;
			border-color: #d8dee9;
		}

		.error {
			background: #fef2f2;
			border-color: #fecaca;
			color: #991b1b;
		}

		.raw {
			background: #111827;
			color: #d1d5db;
			font-family: Consolas, monospace;
			font-size: 12px;
			max-height: 180px;
			overflow: auto;
		}

		.stream-text {
			white-space: pre-wrap;
		}

		.rich-block {
			padding-top: 12px;
			border-top: 1px solid #e2e8f0;
		}

		.rich-block-title {
			display: block;
			margin-bottom: 8px;
			font-size: 14px;
			font-weight: 700;
			color: #334155;
		}

		.bar-chart {
			display: flex;
			align-items: end;
			gap: 12px;
			min-height: 190px;
			padding: 12px 8px 0;
			border-bottom: 1px solid #cbd5e1;
		}

		.bar-chart-item {
			display: flex;
			flex: 1;
			min-width: 32px;
			flex-direction: column;
			align-items: center;
			gap: 6px;
		}

		.bar-chart-value {
			font-size: 12px;
			color: #475569;
		}

		.bar-chart-bar {
			width: min(42px, 100%);
			min-height: 4px;
			border-radius: 4px 4px 0 0;
			background: #0f766e;
		}

		.bar-chart-label {
			font-size: 12px;
			color: #64748b;
			white-space: nowrap;
		}

		.rich-html-frame {
			display: block;
			width: 100%;
			height: 210px;
			border: 1px solid #cbd5e1;
			border-radius: 6px;
			background: #ffffff;
		}

		@media (max-width: 760px) {
			.shell {
				grid-template-columns: 1fr;
			}

			.panel {
				border-right: 0;
				border-bottom: 1px solid #d8dee9;
			}
		}
	</style>
</head>
<body>
<main class="shell">
	<section class="panel">
		<h1>Agent 流式代理测试</h1>
		<label for="agentId">Agent ID</label>
		<input id="agentId" value="dev-assistant" autocomplete="off">

		<label for="conversationId">Conversation ID</label>
		<input id="conversationId" value="test-conversation" autocomplete="off">

		<label for="token">JWT Token</label>
		<textarea id="token" placeholder="粘贴 SSO JWT，可选 Bearer 前缀"></textarea>

		<label for="message">消息</label>
		<textarea id="message" placeholder="输入要发送给 Agent 的内容"></textarea>

		<button id="sendButton" type="button">发送并读取流式响应</button>
	</section>

	<section class="chat">
		<div class="toolbar">
			<strong>聊天对话框</strong>
			<span id="status" class="status">待发送</span>
		</div>
		<div id="messages" class="messages"></div>
	</section>
</main>

<script>
	const sendButton = document.querySelector("#sendButton");
	const statusEl = document.querySelector("#status");
	const messagesEl = document.querySelector("#messages");

	sendButton.addEventListener("click", sendMessage);

	function appendMessage(role, text, extraClass = "") {
		const node = document.createElement("div");
		node.className = `message ${role} ${extraClass}`.trim();
		const body = document.createElement("div");
		body.className = "message-body";
		node.appendChild(body);
		appendTextSegment(body, text);
		messagesEl.appendChild(node);
		messagesEl.scrollTop = messagesEl.scrollHeight;
		return node;
	}

	async function sendMessage() {
		const agentId = document.querySelector("#agentId").value.trim();
		const conversationId = document.querySelector("#conversationId").value.trim();
		const token = normalizeToken(document.querySelector("#token").value.trim());
		const message = document.querySelector("#message").value.trim();

		if (!agentId || !conversationId || !message) {
			statusEl.textContent = "请填写 Agent ID、Conversation ID 和消息";
			return;
		}

		appendMessage("user", message);
		const assistantNode = appendMessage("assistant", "");
		statusEl.textContent = "连接中";
		sendButton.disabled = true;

		try {
			const response = await fetch(requestUrl(conversationId), {
				method: "POST",
				headers: {
					"Accept": "text/event-stream",
					"Content-Type": "application/json",
					...(token ? {"Authorization": token} : {})
				},
				body: JSON.stringify(requestBody(agentId, message))
			});

			if (!response.ok || !response.body) {
				throw new Error(`HTTP ${response.status}`);
			}

			await readSse(response.body, event => handleEvent(event, assistantNode));
			statusEl.textContent = "完成";
		} catch (error) {
			assistantNode.classList.add("error");
			assistantNode.textContent = assistantNode.textContent || `请求失败：${error.message}`;
			statusEl.textContent = "请求失败";
		} finally {
			sendButton.disabled = false;
		}
	}

	function requestUrl(conversationId) {
		return `/api/conversations/${encodeURIComponent(conversationId)}/messages/stream`;
	}

	function requestBody(agentId, message) {
		return {
			agentId,
			message,
			clientMessageId: crypto.randomUUID ? crypto.randomUUID() : String(Date.now())
		};
	}

	function normalizeToken(token) {
		if (!token) {
			return "";
		}
		return token.toLowerCase().startsWith("bearer ") ? token : `Bearer ${token}`;
	}

	async function readSse(body, onEvent) {
		const reader = body.getReader();
		const decoder = new TextDecoder("utf-8");
		let buffer = "";

		while (true) {
			const {value, done} = await reader.read();
			buffer += decoder.decode(value || new Uint8Array(), {stream: !done});
			let boundary;
			while ((boundary = findSseBoundary(buffer)) !== null) {
				const block = buffer.slice(0, boundary.index);
				buffer = buffer.slice(boundary.index + boundary.length);
				const event = parseSseBlock(block);
				if (event) {
					onEvent(event);
				}
			}
			if (done) {
				if (buffer.trim()) {
					const event = parseSseBlock(buffer);
					if (event) {
						onEvent(event);
					}
				}
				break;
			}
		}
	}

	function findSseBoundary(buffer) {
		const match = /\r?\n\r?\n/.exec(buffer);
		return match ? {index: match.index, length: match[0].length} : null;
	}

	function parseSseBlock(block) {
		const lines = block.split(/\r?\n/);
		let event = "message";
		const dataLines = [];

		for (const line of lines) {
			if (line.startsWith("event:")) {
				event = line.slice(6).trim();
			}
			if (line.startsWith("data:")) {
				dataLines.push(line.slice(5).trimStart());
			}
		}

		if (!dataLines.length) {
			return null;
		}

		return {
			event,
			data: JSON.parse(dataLines.join("\n"))
		};
	}

	function handleEvent({event, data}, assistantNode) {
		if (event === "message_start") {
			statusEl.textContent = `回复开始：${data.messageId}`;
			return;
		}
		if (event === "delta") {
			appendStreamText(assistantNode, data.text || "");
			messagesEl.scrollTop = messagesEl.scrollHeight;
			return;
		}
		if (event === "content_block") {
			appendContentBlock(assistantNode, data.block);
			return;
		}
		if (event === "message_end") {
			statusEl.textContent = `回复完成：${data.status}`;
			return;
		}
		if (event === "error") {
			assistantNode.classList.add("error");
			appendStreamText(assistantNode, `\n\n[${data.status}] ${data.reason}`);
			statusEl.textContent = "回复失败";
			return;
		}
		appendMessage("raw", JSON.stringify({event, data}, null, 2), "raw");
	}

	function appendStreamText(assistantNode, text) {
		const body = assistantNode.querySelector(".message-body");
		if (!body) {
			return;
		}
		const lastChild = body.lastElementChild;
		if (lastChild && lastChild.classList.contains("stream-text")) {
			lastChild.textContent += text;
			return;
		}
		appendTextSegment(body, text);
	}

	function appendTextSegment(body, text) {
		const textNode = document.createElement("div");
		textNode.className = "stream-text";
		textNode.textContent = text;
		body.appendChild(textNode);
	}

	function appendContentBlock(assistantNode, block) {
		if (!block || !block.type) {
			appendMessage("raw", JSON.stringify(block, null, 2), "raw");
			return;
		}

		const body = assistantNode.querySelector(".message-body");
		if (!body) {
			return;
		}
		const container = document.createElement("section");
		container.className = "rich-block";
		container.dataset.blockId = block.blockId || "";
		if (block.title) {
			const title = document.createElement("strong");
			title.className = "rich-block-title";
			title.textContent = block.title;
			container.appendChild(title);
		}

		if (block.type === "chart" && block.format === "bar") {
			container.appendChild(renderBarChart(block));
		} else if (block.type === "html" && block.format === "sandbox_iframe") {
			container.appendChild(renderSandboxHtml(block.payload || ""));
		} else {
			const fallback = document.createElement("pre");
			fallback.className = "raw";
			fallback.textContent = JSON.stringify(block, null, 2);
			container.appendChild(fallback);
		}

		body.appendChild(container);
		messagesEl.scrollTop = messagesEl.scrollHeight;
	}

	function renderBarChart(block) {
		const payload = typeof block.payload === "string" ? JSON.parse(block.payload) : (block.payload || {});
		const labels = Array.isArray(payload.labels) ? payload.labels : [];
		const values = Array.isArray(payload.values) ? payload.values : [];
		const maxValue = Math.max(...values, 1);
		const chart = document.createElement("div");
		chart.className = "bar-chart";

		values.forEach((value, index) => {
			const item = document.createElement("div");
			item.className = "bar-chart-item";

			const valueEl = document.createElement("span");
			valueEl.className = "bar-chart-value";
			valueEl.textContent = String(value);

			const bar = document.createElement("div");
			bar.className = "bar-chart-bar";
			bar.style.height = `${Math.max((Number(value) / maxValue) * 140, 4)}px`;
			bar.title = `${labels[index] || `第 ${index + 1} 项`}：${value}`;

			const label = document.createElement("span");
			label.className = "bar-chart-label";
			label.textContent = labels[index] || `第 ${index + 1} 项`;

			item.append(valueEl, bar, label);
			chart.appendChild(item);
		});
		return chart;
	}

	function renderSandboxHtml(html) {
		const frame = document.createElement("iframe");
		frame.className = "rich-html-frame";
		frame.setAttribute("sandbox", "");
		frame.setAttribute("title", "Agent 富文本内容");
		frame.srcdoc = html || "";
		return frame;
	}
</script>
</body>
</html>
