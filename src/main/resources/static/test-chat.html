<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Agent 流式代理测试</title>
	<style>
		:root {
			color-scheme: light;
			font-family: Arial, "Microsoft YaHei", sans-serif;
			background: #f5f7fb;
			color: #1f2937;
		}

		body {
			margin: 0;
			min-height: 100vh;
		}

		.shell {
			display: grid;
			grid-template-columns: 320px minmax(0, 1fr);
			min-height: 100vh;
		}

		.panel {
			background: #ffffff;
			border-right: 1px solid #d8dee9;
			padding: 20px;
		}

		.panel h1 {
			font-size: 20px;
			margin: 0 0 20px;
		}

		label {
			display: block;
			font-size: 13px;
			font-weight: 700;
			margin: 14px 0 6px;
		}

		input,
		textarea,
		button {
			box-sizing: border-box;
			font: inherit;
			width: 100%;
		}

		input,
		textarea {
			border: 1px solid #c9d1df;
			border-radius: 6px;
			padding: 10px;
			background: #ffffff;
		}

		textarea {
			min-height: 120px;
			resize: vertical;
		}

		button {
			border: 0;
			border-radius: 6px;
			padding: 11px 14px;
			background: #2563eb;
			color: #ffffff;
			font-weight: 700;
			cursor: pointer;
			margin-top: 16px;
		}

		button:disabled {
			background: #94a3b8;
			cursor: not-allowed;
		}

		.chat {
			display: flex;
			flex-direction: column;
			min-width: 0;
		}

		.toolbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			padding: 16px 20px;
			background: #ffffff;
			border-bottom: 1px solid #d8dee9;
		}

		.status {
			font-size: 13px;
			color: #64748b;
		}

		.messages {
			flex: 1;
			overflow: auto;
			padding: 20px;
		}

		.message {
			max-width: 820px;
			margin: 0 0 14px;
			padding: 12px 14px;
			border-radius: 8px;
			white-space: pre-wrap;
			line-height: 1.55;
			border: 1px solid transparent;
		}

		.user {
			margin-left: auto;
			background: #dbeafe;
			border-color: #bfdbfe;
		}

		.assistant {
			background: #ffffff;
			border-color: #d8dee9;
		}

		.error {
			background: #fef2f2;
			border-color: #fecaca;
			color: #991b1b;
		}

		.raw {
			background: #111827;
			color: #d1d5db;
			font-family: Consolas, monospace;
			font-size: 12px;
			max-height: 180px;
			overflow: auto;
		}

		@media (max-width: 760px) {
			.shell {
				grid-template-columns: 1fr;
			}

			.panel {
				border-right: 0;
				border-bottom: 1px solid #d8dee9;
			}
		}
	</style>
</head>
<body>
<main class="shell">
	<section class="panel">
		<h1>Agent 流式代理测试</h1>
		<label for="agentId">Agent ID</label>
		<input id="agentId" value="dev-assistant" autocomplete="off">

		<label for="conversationId">Conversation ID</label>
		<input id="conversationId" value="test-conversation" autocomplete="off">

		<label for="token">JWT Token</label>
		<textarea id="token" placeholder="粘贴 SSO JWT，可选 Bearer 前缀"></textarea>

		<label for="message">消息</label>
		<textarea id="message" placeholder="输入要发送给 Agent 的内容"></textarea>

		<button id="sendButton" type="button">发送并读取流式响应</button>
	</section>

	<section class="chat">
		<div class="toolbar">
			<strong>聊天对话框</strong>
			<span id="status" class="status">待发送</span>
		</div>
		<div id="messages" class="messages"></div>
	</section>
</main>

<script>
	const sendButton = document.querySelector("#sendButton");
	const statusEl = document.querySelector("#status");
	const messagesEl = document.querySelector("#messages");

	sendButton.addEventListener("click", sendMessage);

	function appendMessage(role, text, extraClass = "") {
		const node = document.createElement("div");
		node.className = `message ${role} ${extraClass}`.trim();
		node.textContent = text;
		messagesEl.appendChild(node);
		messagesEl.scrollTop = messagesEl.scrollHeight;
		return node;
	}

	async function sendMessage() {
		const agentId = document.querySelector("#agentId").value.trim();
		const conversationId = document.querySelector("#conversationId").value.trim();
		const token = normalizeToken(document.querySelector("#token").value.trim());
		const message = document.querySelector("#message").value.trim();

		if (!agentId || !conversationId || !message) {
			statusEl.textContent = "请填写 Agent ID、Conversation ID 和消息";
			return;
		}

		appendMessage("user", message);
		const assistantNode = appendMessage("assistant", "");
		statusEl.textContent = "连接中";
		sendButton.disabled = true;

		try {
			const response = await fetch(`/api/conversations/${encodeURIComponent(conversationId)}/messages/stream`, {
				method: "POST",
				headers: {
					"Accept": "text/event-stream",
					"Content-Type": "application/json",
					...(token ? {"Authorization": token} : {})
				},
				body: JSON.stringify({
					agentId,
					message,
					clientMessageId: crypto.randomUUID ? crypto.randomUUID() : String(Date.now())
				})
			});

			if (!response.ok || !response.body) {
				throw new Error(`HTTP ${response.status}`);
			}

			await readSse(response.body, event => handleEvent(event, assistantNode));
			statusEl.textContent = "完成";
		} catch (error) {
			assistantNode.classList.add("error");
			assistantNode.textContent = assistantNode.textContent || `请求失败：${error.message}`;
			statusEl.textContent = "请求失败";
		} finally {
			sendButton.disabled = false;
		}
	}

	function normalizeToken(token) {
		if (!token) {
			return "";
		}
		return token.toLowerCase().startsWith("bearer ") ? token : `Bearer ${token}`;
	}

	async function readSse(body, onEvent) {
		const reader = body.getReader();
		const decoder = new TextDecoder("utf-8");
		let buffer = "";

		while (true) {
			const {value, done} = await reader.read();
			buffer += decoder.decode(value || new Uint8Array(), {stream: !done});
			let boundary;
			while ((boundary = buffer.indexOf("\n\n")) >= 0) {
				const block = buffer.slice(0, boundary);
				buffer = buffer.slice(boundary + 2);
				const event = parseSseBlock(block);
				if (event) {
					onEvent(event);
				}
			}
			if (done) {
				if (buffer.trim()) {
					const event = parseSseBlock(buffer);
					if (event) {
						onEvent(event);
					}
				}
				break;
			}
		}
	}

	function parseSseBlock(block) {
		const lines = block.split(/\r?\n/);
		let event = "message";
		const dataLines = [];

		for (const line of lines) {
			if (line.startsWith("event:")) {
				event = line.slice(6).trim();
			}
			if (line.startsWith("data:")) {
				dataLines.push(line.slice(5).trimStart());
			}
		}

		if (!dataLines.length) {
			return null;
		}

		return {
			event,
			data: JSON.parse(dataLines.join("\n"))
		};
	}

	function handleEvent({event, data}, assistantNode) {
		if (event === "message_start") {
			statusEl.textContent = `回复开始：${data.messageId}`;
			return;
		}
		if (event === "delta") {
			assistantNode.textContent += data.text || "";
			messagesEl.scrollTop = messagesEl.scrollHeight;
			return;
		}
		if (event === "message_end") {
			statusEl.textContent = `回复完成：${data.status}`;
			return;
		}
		if (event === "error") {
			assistantNode.classList.add("error");
			assistantNode.textContent += `\n\n[${data.status}] ${data.reason}`;
			statusEl.textContent = "回复失败";
			return;
		}
		appendMessage("raw", JSON.stringify({event, data}, null, 2), "raw");
	}
</script>
</body>
</html>
