spring.application.name=agent.entrance
spring.main.banner-mode=off

# SSO JWT config is refreshed from this URL on startup and by scheduler.
# Example response:
# {"cookieName":"SSO_TOKEN","issuers":{"https://sso.tenant-a.example.com":{"publicKeyUri":"https://sso.tenant-a.example.com/oauth/public-key"}}}
sso.jwt.config-url=https://config.example.com/agent-entrance/sso-jwt
sso.jwt.refresh-delay-millis=300000
sso.jwt.refresh-on-startup=true
